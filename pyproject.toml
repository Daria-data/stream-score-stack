[project]
name = "olympscore"
version = "0.1.0"
description = "OlympScore: Olympic results data platform (ETL, PostgreSQL, FastAPI, Streamlit, Airflow)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
]

[dependency-groups]
airflow = [
    "apache-airflow>=3.0.0",
    "apache-airflow-providers-postgres>=6.1.3",
]
core = [
    "beautifulsoup4>=4.13.0",
    "duckdb>=1.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "pyarrow>=18.0.0",
    "sqlalchemy>=1.4.54",
    "streamlit>=1.45.0",
    "uvicorn>=0.34.0",
]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.8",
]
